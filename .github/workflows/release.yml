name: Release

# Builds a downloadable Windows installer and a portable zip whenever a
# version tag is pushed, and attaches both to a GitHub Release. This is what
# lets someone use Project Bedrock without installing Rust or cloning
# anything.
#
# To cut a release:
#     git tag v0.1.0
#     git push origin v0.1.0
#
# `workflow_dispatch` also lets you run it by hand from the Actions tab to
# check the build works before committing to a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Compiling this from cold takes several minutes; caching makes repeat
      # releases quick.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Derive version
        id: version
        shell: bash
        # Tag builds carry the tag; manual runs get a placeholder so the
        # installer still has a sensible name.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # Inno Setup ships on the windows-latest image, so there is nothing to
      # install here.
      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.value }} installer\project-bedrock.iss

      # A zip for people who would rather not run an installer at all.
      - name: Build portable zip
        shell: pwsh
        run: |
          $stage = "dist/portable/ProjectBedrock"
          New-Item -ItemType Directory -Force -Path "$stage/Blender Add-on" | Out-Null
          Copy-Item target/release/project-bedrock.exe $stage
          Copy-Item project_bedrock_import_tools.py "$stage/Blender Add-on"
          Copy-Item README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist/ProjectBedrock-${{ steps.version.outputs.value }}-portable.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-bedrock-windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
