name: Release

# Builds a downloadable Windows installer and a portable zip whenever a
# version tag is pushed, and attaches both to a GitHub Release. This is what
# lets someone use Project Bedrock without installing Rust or cloning
# anything.
#
# To cut a release:
#     git tag v0.1.0
#     git push origin v0.1.0
#
# `workflow_dispatch` also lets you run it by hand from the Actions tab to
# check the build works before committing to a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Compiling this from cold takes several minutes; caching makes repeat
      # releases quick.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Derive version
        id: version
        shell: bash
        # Tag builds carry the tag; manual runs get a placeholder so the
        # installer still has a sensible name.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # Inno Setup reports a missing Source: only once it runs, which is
      # otherwise eight minutes into the build. Fail on it immediately.
      - name: Check installer sources
        run: python tools/check_installer.py

      # Inno Setup ships on the windows-latest image, so there is nothing to
      # install here.
      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.value }} installer\project-bedrock.iss

      # A zip for people who would rather not run an installer at all.
      - name: Build portable zip
        shell: pwsh
        run: |
          $stage = "dist/portable/Project Bedrock"
          New-Item -ItemType Directory -Force -Path "$stage/Blender Add-on" | Out-Null
          # Shipped under the name the user actually double-clicks.
          Copy-Item target/release/project-bedrock.exe "$stage/Project Bedrock.exe"
          Copy-Item project_bedrock_import_tools.py "$stage/Blender Add-on"
          Copy-Item README.md $stage
          Copy-Item installer/START-HERE.txt $stage
          Compress-Archive -Path $stage -DestinationPath "dist/ProjectBedrock-${{ steps.version.outputs.value }}-portable.zip" -Force

      # Also on its own, because the Releases page is where people look and
      # the add-on being bundled inside the other two downloads is invisible
      # from there. Someone who already has the app just wants this file.
      - name: Stage the Blender add-on as its own download
        shell: pwsh
        run: Copy-Item project_bedrock_import_tools.py dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-bedrock-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.py

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Project Bedrock ${{ steps.version.outputs.value }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.py
          # Deliberately not generate_release_notes: a list of commit
          # subjects tells a downloader nothing about which file they want.
          # The changelog is linked from the body instead.
          # Spelled out because this is two pieces -- a Windows app and a
          # Blender add-on -- and a page listing only file names leaves
          # someone guessing which they need and what to do with them.
          body: |
            Get a Minecraft world into Blender looking like the game.

            This is **two pieces**: a Windows app that reads your save and
            exports a region, and a Blender add-on that imports what it wrote.
            You need both.

            ## 1. The app — pick one

            | Download | |
            |---|---|
            | **ProjectBedrock-${{ steps.version.outputs.value }}-Setup.exe** | Installs it. No admin prompt, uninstalls normally. |
            | **ProjectBedrock-${{ steps.version.outputs.value }}-portable.zip** | Unzip and run `Project Bedrock.exe`. Nothing installed. |

            Windows may show a blue **"Windows protected your PC"** box the
            first time. Click *More info* then *Run anyway* — it appears
            because the app is not code-signed, and it shows up once.

            ## 2. The Blender add-on

            **project_bedrock_import_tools.py**

            Already included in both downloads above, so grab it here only if
            you have the app and just want the add-on on its own.

            In Blender: **Edit > Preferences > Add-ons > Install**, pick the
            `.py`, and tick the box to enable it. Then export from Project
            Bedrock and use **File > Import > Project Bedrock** on the `.obj`
            it wrote.

            Close the app before importing — while it is running it holds the
            export folder open.

            If you have [MCprep](https://github.com/Moo-Ack-Productions/MCprep)
            installed the add-on will use its assets for plants, mobs and
            torches. It works fine without.

            ## Known gaps

            - Entities — mobs, armour stands, item frames, minecarts — are not
              read yet.
            - Decorated pots come through as plain cubes.
            - Sign text and banner patterns are not read.

            Blocks otherwise carry their real geometry, including the shapes
            the game draws in code (bells, chests, shulker boxes, banners,
            conduits), and animated textures play.

            ---

            [Full changelog](https://github.com/ZebulonHue/Bedrock-Alpha/commits/v${{ steps.version.outputs.value }})
